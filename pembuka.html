<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Sebuah Cerita</title>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <!-- CSS Pembuka -->
    <link
        rel="stylesheet"
        href="pembuka.css">

</head>


<body>


    <!-- =================================
         BACKGROUND PARTICLES
    ================================== -->

    <div class="particles">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>


    <!-- =================================
         HALAMAN PEMBUKA
    ================================== -->

    <main class="opening-page">


        <!-- Cahaya belakang -->

        <div class="glow glow-one"></div>

        <div class="glow glow-two"></div>


        <!-- Simbol hati -->

        <div class="heart">

            <span>♥</span>

        </div>


        <!-- Teks -->

        <div class="opening-content">


            <p class="small-text">
                SEBUAH CERITA
            </p>


            <h1>

                Sebelum kita
                <br>

                <em>berpisah...</em>

            </h1>


            <div class="line"></div>


            <p class="description">

                Ada sebuah cerita yang ingin
                dikenang kembali.

                <br>

                Tentang tawa, perjalanan,
                dan seseorang yang pernah
                begitu berarti.

            </p>


            <!-- Tombol -->

            <button
                id="openStory"
                class="open-button">

                <span>
                    Buka Cerita Kita
                </span>

                <span class="arrow">
                    →
                </span>

            </button>


            <p class="hint">

                ✨ Sebuah perjalanan kecil
                menunggu untuk dibuka

            </p>


        </div>


    </main>


    <!-- JavaScript -->

    <script src="pembuka.js"></script>

</body>

</html>
